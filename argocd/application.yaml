# Tells Argo CD: "keep the cluster in sync with the Helm chart in this Git repo".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-app
  namespace: argocd            # Applications always live in the argocd namespace
spec:
  project: default

  source:
    repoURL: https://github.com/dikshaingole/argocd-helm-demo.git
    targetRevision: main       # branch to watch
    path: hello-app            # folder that holds Chart.yaml
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc   # the same cluster Argo CD runs in
    namespace: hello                          # where the app gets deployed

  syncPolicy:
    automated:
      prune: true      # delete things you remove from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
