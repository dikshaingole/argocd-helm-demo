# The HTML page. Its text and colour come from values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-page
  labels:
    app: {{ .Release.Name }}
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>{{ .Values.page.title }}</title></head>
      <body style="background: {{ .Values.page.backgroundColor }}; color: white; font-family: sans-serif; text-align: center; padding-top: 15vh;">
        <h1>{{ .Values.page.title }}</h1>
        <h2>{{ .Values.page.message }}</h2>
        <p>Release: {{ .Release.Name }} | Chart: {{ .Chart.Name }}-{{ .Chart.Version }} | Replicas: {{ .Values.replicaCount }}</p>
      </body>
    </html>
